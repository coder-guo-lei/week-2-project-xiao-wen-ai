name: Deploy

on:
  push:
    branches: [leiFz]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ==================== 前端部署到 GitHub Pages ====================
  deploy-frontend:
    name: 前端 - 部署到 GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: xiao-wen-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: xiao-wen-ai/package-lock.json

      - name: 安装前端依赖
        run: npm install

      - name: 构建生产包
        run: npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: xiao-wen-ai/dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==================== 后端部署示例（需替换为实际服务器） ====================
  deploy-backend:
    name: 后端 - 部署到服务器
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: 通过 SSH 部署后端
        uses: appleboy/scp-action@v0.1.7
        if: ${{ secrets.SERVER_HOST != '' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "backend/*"
          target: "/opt/xiao-wen-ai/backend"
          strip_components: 1

      - name: 重启后端服务
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.SERVER_HOST != '' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/xiao-wen-ai/backend
            pip install -r requirements.txt
            sudo systemctl restart xiao-wen-ai
