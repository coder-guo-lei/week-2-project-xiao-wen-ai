name: CI

on:
  push:
    branches: [leiFz]
  pull_request:
    branches: [leiFz]

jobs:
  # ==================== 前端检查 ====================
  frontend-lint:
    name: 前端 - ESLint + Prettier 检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiao-wen-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: xiao-wen-ai/package-lock.json

      - name: 安装前端依赖
        run: npm install

      - name: ESLint 代码质量检查
        run: npm run lint

      - name: Prettier 格式检查
        run: npm run format:check

  # ==================== 前端构建 ====================
  frontend-build:
    name: 前端 - 构建验证
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiao-wen-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: xiao-wen-ai/package-lock.json

      - name: 安装前端依赖
        run: npm install

      - name: 构建生产包
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: xiao-wen-ai/dist/
          retention-days: 7

  # ==================== 后端检查 ====================
  backend-lint:
    name: 后端 - Python 语法检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r requirements.txt

      - name: 安装 flake8
        run: pip install flake8

      - name: flake8 语法检查
        run: flake8 . --max-line-length=120 --exclude=__pycache__,.env --ignore=E501,W503

  # ==================== 后端测试 ====================
  backend-test:
    name: 后端 - 运行测试
    needs: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: python -m pytest tests/ -v || echo "暂无测试用例，跳过"
